services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunar
      POSTGRES_PASSWORD: hunar
      POSTGRES_DB: hunar
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - hunar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunar -d hunar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUNAR_API_KEY: ${HUNAR_API_KEY:-replace-me}
      HUNAR_BASE_URL: ${HUNAR_BASE_URL:-https://api.voice.hunar.ai/external/v1}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      DATABASE_URL: postgresql://hunar:hunar@db:5432/hunar
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3010}
      # Container-internal address: the app listens on :8000 *inside* the container
      # regardless of the host-side port mapping below, so MockProvider's self-POST must
      # target :8000, not the host-facing BACKEND_PORT.
      INTERNAL_BASE_URL: http://localhost:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-dev-mock-secret}
      MOCK_CALL_DURATION_SECONDS: ${MOCK_CALL_DURATION_SECONDS:-8}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      POLL_STALE_AFTER_SECONDS: ${POLL_STALE_AFTER_SECONDS:-20}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      ENABLE_POST_CALL_PIPELINE: ${ENABLE_POST_CALL_PIPELINE:-true}
      PEOPLE_SEARCH_PROVIDER: ${PEOPLE_SEARCH_PROVIDER:-mock}
      PEOPLE_SEARCH_MAX_RESULTS: ${PEOPLE_SEARCH_MAX_RESULTS:-25}
      AGENT_AUTOCREATE: ${AGENT_AUTOCREATE:-true}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      PDL_API_KEY: ${PDL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATTENDANCE_PRESENT_RATE: ${ATTENDANCE_PRESENT_RATE:-0.85}
      ATTENDANCE_MISSED_CALL_RATE: ${ATTENDANCE_MISSED_CALL_RATE:-0.4}
      DEMO_SEED_ON_START: ${DEMO_SEED_ON_START:-false}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      # docs/ is also baked into the image at build time (see backend/Dockerfile), which is
      # what a cloud deploy without a host filesystem relies on - this bind-mount just overlays
      # the live docs/ directory for local dev, so editing docs/attendance-design.md doesn't
      # need a rebuild to show up in the Attendance module's Design tab.
      - ./docs:/app/docs:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-3010}:3000"

volumes:
  hunar_postgres_data:
