line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length isn't worth the churn.
# UP017: `datetime.UTC` needs Python 3.11 - the Docker image is 3.11, but native dev on
# this machine only has 3.10 available, so keep `timezone.utc` for portability.
ignore = ["E501", "UP017"]

[lint.isort]
known-first-party = ["app"]
